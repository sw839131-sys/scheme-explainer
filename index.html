<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Government Scheme Explainer</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 16px; }
    textarea { width: 100%; height: 160px; padding: 8px; }
    select, button { padding: 10px; margin-top: 10px; margin-right: 6px; font-size: 16px; }
    .box { margin-top: 20px; padding: 12px; background: #f3f3f3; border-radius: 8px; white-space: pre-wrap; }
    .q { margin: 12px 0; }
    label { margin-right: 16px; }
    #voiceNote { margin-top: 8px; font-size: 14px; color: #a15c00; }
  </style>
</head>
<body>
  <h2>Government Scheme Explainer</h2>
  <textarea id="notice" placeholder="Paste a scheme or government notice here"></textarea>
  <br>
  <select id="lang">
    <option>Marathi</option>
    <option>Hindi</option>
    <option>English</option>
  </select>
  <button onclick="explain()">Explain</button>
  <button onclick="getQuestions()">Check my eligibility</button>

  <div id="result" class="box">The explanation will appear here.</div>
  <button onclick="speak('result')">Listen</button>
  <button onclick="stopSpeaking()">Stop</button>
  <div id="voiceNote"></div>

  <div id="quiz"></div>

  <script>
    let questions = [];

    function inputs() {
      return {
        text: document.getElementById("notice").value,
        lang: document.getElementById("lang").value,
      };
    }

    async function post(url, data) {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      return r.json();
    }

    async function explain() {
      const result = document.getElementById("result");
      result.innerText = "Thinking...";
      try {
        const data = await post("/api/explain", inputs());
        result.innerText = data.answer;
      } catch (e) {
        result.innerText = "Something went wrong. Is the server running?";
      }
    }

    async function getQuestions() {
      const quiz = document.getElementById("quiz");
      quiz.className = "box";
      quiz.innerText = "Preparing questions...";
      try {
        const data = await post("/api/questions", inputs());
        questions = data.questions || [];
        if (questions.length === 0) {
          quiz.innerText = data.answer || "Could not make questions. Try again.";
          return;
        }
        quiz.innerHTML = "";
        questions.forEach((q, i) => {
          const div = document.createElement("div");
          div.className = "q";
          const p = document.createElement("p");
          p.innerText = q;
          div.appendChild(p);
          ["Yes", "No"].forEach((v) => {
            const label = document.createElement("label");
            label.innerHTML = `<input type="radio" name="q${i}" value="${v}"> ${v}`;
            div.appendChild(label);
          });
          quiz.appendChild(div);
        });
        const btn = document.createElement("button");
        btn.innerText = "Get result";
        btn.onclick = getVerdict;
        quiz.appendChild(btn);

        const listenBtn = document.createElement("button");
        listenBtn.innerText = "Listen";
        listenBtn.onclick = () => speak("verdict");
        quiz.appendChild(listenBtn);

        const out = document.createElement("div");
        out.id = "verdict";
        out.style.marginTop = "12px";
        out.style.whiteSpace = "pre-wrap";
        quiz.appendChild(out);
      } catch (e) {
        quiz.innerText = "Something went wrong. Is the server running?";
      }
    }

    async function getVerdict() {
      const out = document.getElementById("verdict");
      out.innerText = "Checking...";
      const answers = questions.map((q, i) => {
        const picked = document.querySelector(`input[name="q${i}"]:checked`);
        return { q, a: picked ? picked.value : "Not answered" };
      });
      try {
        const data = await post("/api/verdict", { ...inputs(), answers });
        out.innerText = data.answer;
      } catch (e) {
        out.innerText = "Something went wrong.";
      }
    }

    // ---------- Voice ----------
    const LANG_CODES = { Marathi: "mr-IN", Hindi: "hi-IN", English: "en-IN" };

    function findVoice(code) {
      const voices = window.speechSynthesis.getVoices();
      const base = code.split("-")[0];
      return (
        voices.find((v) => v.lang.replace("_", "-") === code) ||
        voices.find((v) => v.lang.toLowerCase().startsWith(base))
      );
    }

    function speak(elementId) {
      const note = document.getElementById("voiceNote");
      note.innerText = "";
      if (!("speechSynthesis" in window)) {
        note.innerText = "Voice is not supported in this browser.";
        return;
      }
      const el = document.getElementById(elementId);
      const text = el ? el.innerText.trim() : "";
      if (!text) {
        note.innerText = "Nothing to read yet.";
        return;
      }
      const lang = document.getElementById("lang").value;
      let code = LANG_CODES[lang];
      let voice = findVoice(code);

      // Marathi voice missing: Hindi voice can read Devanagari text
      if (!voice && lang === "Marathi") {
        voice = findVoice("hi-IN");
        if (voice) {
          code = "hi-IN";
          note.innerText = "No Marathi voice found on this device. Using a Hindi voice.";
        }
      }
      if (!voice) {
        note.innerText = "No voice installed for " + lang + " on this device.";
      }

      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = code;
      if (voice) u.voice = voice;
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }

    function stopSpeaking() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    }
  </script>
</body>
</html>
